name: CI

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest -m "not live" --cov --cov-report=term-missing

      - name: Report the derived version
        run: echo "version=$(uv run python scripts/version.py)" >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Build and Push container image
    runs-on: ubuntu-latest
    # Without this the two jobs run in parallel and a failing test still
    # publishes `latest`. The quality gate has to be upstream of the push to be
    # a gate at all.
    needs: quality
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Derive the version from the git tag
        id: version
        run: echo "value=$(uv run python scripts/version.py)" >> "$GITHUB_OUTPUT"

      - name: Derive the Docker Hub tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: lordraw/discoverygram
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # `load: true` is incompatible with a multi-platform build: the local
          # docker image store cannot hold a manifest list. The verification
          # step below pulls the pushed image per architecture instead.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the published manifest is multi-arch
        run: |
          docker buildx imagetools inspect \
            lordraw/discoverygram:${{ steps.version.outputs.value }}
          for arch in amd64 arm64; do
            docker buildx imagetools inspect \
              lordraw/discoverygram:${{ steps.version.outputs.value }} \
              --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}' \
              | grep -q "linux/$arch"
            echo "manifest carries linux/$arch"
          done

      - name: Verify the image reports that version
        # amd64 only: this runner cannot execute the arm64 image without QEMU
        # binfmt, and the version is baked in identically for both.
        run: |
          reported=$(docker run --rm --platform linux/amd64 \
            --entrypoint python lordraw/discoverygram:${{ steps.version.outputs.value }} \
            -c "import discoverygram; print(discoverygram.__version__)")
          echo "image reports $reported, expected ${{ steps.version.outputs.value }}"
          test "$reported" = "${{ steps.version.outputs.value }}"