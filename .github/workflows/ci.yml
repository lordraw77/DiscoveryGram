name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
      - '*.*.*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest -m "not live" --cov --cov-report=term-missing

      - name: Report the derived version
        run: echo "version=$(uv run python scripts/version.py)" >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Build and Push container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Derive the version from the git tag
        id: version
        run: echo "value=$(uv run python scripts/version.py)" >> "$GITHUB_OUTPUT"

      - name: Docker Meta (Genera i tag per Docker Hub)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: lordraw/discoverygram
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        # Esegue il login solo per le push (main o tag), non per le PR provenienti da fork
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image reports that version
        run: |
          reported=$(docker run --rm --entrypoint python lordraw/discoverygram:${{ steps.version.outputs.value }} \
            -c "import discoverygram; print(discoverygram.__version__)")
          echo "image reports $reported, expected ${{ steps.version.outputs.value }}"
          test "$reported" = "${{ steps.version.outputs.value }}"