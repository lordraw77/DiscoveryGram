name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version is derived from the git tag, so the full history and
          # its tags have to be present — a shallow clone yields 0.1.dev1+...
          # for every commit regardless of what is actually tagged.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        # --locked fails if uv.lock is stale, so CI tests exactly the
        # dependency set the container image is built from.
        run: uv sync --all-extras --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest -m "not live" --cov --cov-report=term-missing

      - name: Report the derived version
        run: echo "version=$(uv run python scripts/version.py)" >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Derive the version from the git tag
        id: version
        run: echo "value=$(uv run python scripts/version.py)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: discoverygram:ci
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image reports that version
        run: |
          reported=$(docker run --rm --entrypoint python discoverygram:ci \
            -c "import discoverygram; print(discoverygram.__version__)")
          echo "image reports $reported, expected ${{ steps.version.outputs.value }}"
          test "$reported" = "${{ steps.version.outputs.value }}"
