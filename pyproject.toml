[project]
name = "discoverygram"
# The version comes from the git tag, never from a literal in this file.
# See [tool.hatch.version] below and scripts/version.py.
dynamic = ["version"]
description = "Telegram bot that makes a NoteDiscovery instance searchable, navigable and writable"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

dependencies = [
    "python-telegram-bot[rate-limiter]>=22.5,<23",
    "httpx>=0.28,<0.29",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "structlog>=24.4",
    "aiohttp>=3.10,<4",
]

[project.optional-dependencies]
redis = ["redis>=5.2,<6"]
mcp = ["mcp>=1.2"]

[project.scripts]
discoverygram = "discoverygram.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
    # Lets scripts/version.py derive the version exactly as the build backend
    # does, instead of reimplementing the derivation and drifting from it.
    "hatch-vcs>=0.4",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Single source of truth for the version: the git tag. A build from a tagged
# commit produces that tag; a build from any other commit produces a PEP 440
# development version pointing at it (0.1.1.dev4+g1a2b3c4), so an image built
# from an untagged commit can never be mistaken for a release.
[tool.hatch.version]
source = "vcs"
raw-options = { version_scheme = "guess-next-dev", local_scheme = "node-and-date" }

[tool.hatch.build.targets.wheel]
packages = ["src/discoverygram"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S", "A", "PTH"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# The port's error names are the vocabulary the whole application speaks
# (`NotFound`, `Unsupported`, ...); an `Error` suffix on each would only add noise.
# Button labels are emoji by design; RUF001 reads them as ambiguous punctuation.
"src/discoverygram/bot/browse.py" = ["RUF001"]
"src/discoverygram/ports/errors.py" = ["N818"]
"src/discoverygram/ports/llm_errors.py" = ["N818"]
"src/discoverygram/util/paths.py" = ["N818"]
"tests/*" = ["S105", "S106"]
"scripts/*" = ["S105", "S106", "T201"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["telegram.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: tests that hit a real NoteDiscovery instance (opt-in, needs credentials)",
]

[tool.coverage.run]
source = ["src/discoverygram"]
branch = true
